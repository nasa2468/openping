<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenPing</title><style>:root{font-family:system-ui,sans-serif;background:#f5f7fb;color:#111827}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1100px;margin:auto;padding:38px 20px}h1{margin:0;font-size:30px}.sub{color:#6b7280;margin:6px 0 26px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px}.label{font-size:13px;color:#6b7280}.metric{font-size:27px;font-weight:750;margin-top:8px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.btn{padding:9px 13px;border:1px solid #d1d5db;border-radius:9px;background:#fff;text-decoration:none;color:#111827}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:13px 10px;border-bottom:1px solid #eef0f3;font-size:14px}.badge{font-weight:700}.up{color:#16803c}.down{color:#c62828}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>OpenPing</h1><div class="sub">Open-source uptime & network monitoring</div><div class="grid"><div class="card"><div class="label">Monitors</div><div class="metric" id="monitors">—</div></div><div class="card"><div class="label">Online</div><div class="metric" id="online">—</div></div><div class="card"><div class="label">Average uptime</div><div class="metric" id="uptime">—</div></div></div><div class="card"><div class="toolbar"><a class="btn" href="/api/export.csv">Export CSV</a><a class="btn" href="/metrics">Prometheus</a></div><table><thead><tr><th>Target</th><th>Status</th><th>Uptime</th><th>Avg latency</th><th>Last check</th></tr></thead><tbody id="rows"></tbody></table></div></div><script>async function refresh(){const r=await fetch('/api/targets');const d=await r.json();const a=d||[];monitors.textContent=a.length;online.textContent=a.filter(x=>x.up).length;uptime.textContent=(a.length?a.reduce((s,x)=>s+x.uptime_percent,0)/a.length:0).toFixed(2)+'%';rows.innerHTML=a.map(x=>'<tr><td>'+esc(x.target)+'</td><td class="badge '+(x.up?'up':'down')+'">'+(x.up?'UP':'DOWN')+'</td><td>'+x.uptime_percent.toFixed(2)+'%</td><td>'+x.avg_latency_ms.toFixed(1)+' ms</td><td>'+new Date(x.last_check).toLocaleString()+'</td></tr>').join('')}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}refresh();setInterval(refresh,5000)</script></body></html>
